{% extends 'base.html' %}
{% load bootstrap4 %}

{% block body %}
<div class="container py-5">
    <h2 class="mb-4">Add New Property</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% bootstrap_form form %}
        <button type="submit" class="btn btn-primary">Create Property</button>
    </form>
</div>
{% endblock body %}
