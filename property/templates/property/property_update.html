{% extends 'base.html' %}
{% load bootstrap4 %}

{% block body %}
<div class="container py-5">
    <h2 class="mb-4">Edit Property: {{ property.name }}</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% bootstrap_form form %}
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ property.get_absolute_url }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock body %}
